<!DOCTYPE html>
<html>

<head>

<title>Re-upload Survey PDF</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<link
rel="stylesheet"
href="{{ url_for('static',
filename='css/mobile.css') }}">

<style>
.upload-password-box{
    margin:15px 0;
    padding:16px;
    border:1px solid #fcd34d;
    border-radius:12px;
    background:#fff8e1;
}
.upload-password-box label{
    display:block;
    font-weight:700;
    color:#92400e;
    margin-bottom:8px;
    font-size:15px;
}
.upload-password-box input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}
.upload-password-hint{
    margin:8px 0 0;
    font-size:12px;
    color:#92400e;
    line-height:1.4;
}
</style>

</head>

<body>

<div class="mobile-header">

PDF RE-UPLOAD

</div>

<div class="container">

<div class="card">

<h2>

⚠ PDF Re-upload Required

</h2>

<p>

<b>Reason:</b>

</p>

<p style="color:red;">

{{ survey.pdf_reupload_reason }}

</p>

<form
method="POST"
enctype="multipart/form-data"
id="reuploadForm">

<label
for="survey_pdf"
class="upload-card">

📄 Choose Correct PDF

</label>

<input
type="file"
id="survey_pdf"
name="survey_pdf"
accept="application/pdf"
required
hidden>

<p
id="filename"
style="margin-top:15px;"></p>

{% if require_upload_password %}

<!-- Krish-team gate, same as the first upload. The server re-checks it in
routes/captain.py before the corrected PDF is accepted. -->

<div class="upload-password-box">

<label for="survey_upload_password">
🔒 Survey Upload Password
</label>

<input
type="password"
id="survey_upload_password"
name="survey_upload_password"
placeholder="Enter the password shared by your regional manager"
autocomplete="off"
required>

<p class="upload-password-hint">
This state's survey form needs the password from your regional manager.
</p>

</div>

{% endif %}

<button
type="submit"
class="main-btn"
id="uploadBtn"
disabled>

UPLOAD PDF

</button>

<!-- Progress + single-upload lock live in static/js/pdf_upload_progress.js.
Shown only while the POST is in flight. -->
<div
id="pdfUploadPanel"
class="pdf-upload-panel"
hidden>

<div
id="pdfUploadBar"
class="pdf-upload-bar">

<div
id="pdfUploadFill"
class="pdf-upload-fill"></div>

</div>

<div
id="pdfUploadCaption"
class="pdf-upload-caption"></div>

</div>

</form>

</div>

</div>

<script>

const input =
document.getElementById(
    "survey_pdf"
);

const btn =
document.getElementById(
    "uploadBtn"
);

const file =
document.getElementById(
    "filename"
);

// Present only for the Krish team's states. The server validates it again;
// this just keeps the button honest on the page.
const uploadPasswordInput =
document.getElementById(
    "survey_upload_password"
);

function passwordFilled(){

    return !uploadPasswordInput
    || uploadPasswordInput.value.trim().length > 0;

}

function updateButton(){

    btn.disabled = !(input.files.length && passwordFilled());

}

input.addEventListener(
    "change",
    function(){

    if(this.files.length){

        file.innerHTML =
        this.files[0].name;

    }

    updateButton();

});

if(uploadPasswordInput){

    uploadPasswordInput.addEventListener(
        "input",
        updateButton
    );

}

// The progress uploader resets the button through this after a failed upload.
window.surveyFormRefresh = updateButton;

</script>

<script src="{{ url_for('static', filename='js/pdf_upload_progress.js') }}"></script>

<script>

document
.getElementById("reuploadForm")
.addEventListener(
    "submit",
    function(){

    // Fallback only. pdf_upload_progress.js owns the button while a POST is in
    // flight, which is what stops a second tap uploading the same PDF twice.
    if (!window.pdfUploadProgressReady) {

        btn.disabled = true;

        btn.innerHTML =
        "UPLOADING…";

    }

    }
);

</script>

</body>

</html>
