<!DOCTYPE html>
<html>

<head>

<title>Re-upload Survey PDF</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<link
rel="stylesheet"
href="{{ url_for('static',
filename='css/mobile.css') }}">

</head>

<body>

<div class="mobile-header">

PDF RE-UPLOAD

</div>

<div class="container">

<div class="card">

<h2>

⚠ PDF Re-upload Required

</h2>

<p>

<b>Reason:</b>

</p>

<p style="color:red;">

{{ survey.pdf_reupload_reason }}

</p>

<form
method="POST"
enctype="multipart/form-data"
id="reuploadForm">

<label
for="survey_pdf"
class="upload-card">

📄 Choose Correct PDF

</label>

<input
type="file"
id="survey_pdf"
name="survey_pdf"
accept="application/pdf"
required
hidden>

<p
id="filename"
style="margin-top:15px;"></p>

<button
type="submit"
class="main-btn"
id="uploadBtn"
disabled>

UPLOAD PDF

</button>

<!-- Progress + single-upload lock live in static/js/pdf_upload_progress.js.
Shown only while the POST is in flight. -->
<div
id="pdfUploadPanel"
class="pdf-upload-panel"
hidden>

<div
id="pdfUploadBar"
class="pdf-upload-bar">

<div
id="pdfUploadFill"
class="pdf-upload-fill"></div>

</div>

<div
id="pdfUploadCaption"
class="pdf-upload-caption"></div>

</div>

</form>

</div>

</div>

<script>

const input =
document.getElementById(
    "survey_pdf"
);

const btn =
document.getElementById(
    "uploadBtn"
);

const file =
document.getElementById(
    "filename"
);

function updateButton(){

    btn.disabled = !input.files.length;

}

input.addEventListener(
    "change",
    function(){

    if(this.files.length){

        file.innerHTML =
        this.files[0].name;

    }

    updateButton();

});

// The progress uploader resets the button through this after a failed upload.
window.surveyFormRefresh = updateButton;

</script>

<script src="{{ url_for('static', filename='js/pdf_upload_progress.js') }}"></script>

<script>

document
.getElementById("reuploadForm")
.addEventListener(
    "submit",
    function(){

    // Fallback only. pdf_upload_progress.js owns the button while a POST is in
    // flight, which is what stops a second tap uploading the same PDF twice.
    if (!window.pdfUploadProgressReady) {

        btn.disabled = true;

        btn.innerHTML =
        "UPLOADING…";

    }

    }
);

</script>

</body>

</html>
