<!DOCTYPE html>
<html>

<head>

    

    <title>Select Survey</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
href="{{ url_for('static',
filename='css/mobile.css') }}">

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

</head>

<body>

<div class="mobile-header">

    <div class="logo-title">
        VIAMA SURVEILLANCE
    </div>

    

</div>

<div class="container">

    <div class="card">

        <div class="captain-card">

    <div class="captain-name">
        👤 {{ user.name }}
    </div>

    <div class="captain-state">
         {{ assignments|length }} Assigned Stretches
    </div>

    <div class="captain-status">
         Ready For Survey
    </div>

</div>

        <h2>Select Stretch</h2>

        {% if session.get("success_message") %}

<div class="success-box">

    {{ session.pop("success_message") }}

</div>

{% endif %}

        <form method="POST">

            <div class="form-group">

<label>
Assigned Stretch
</label>



<select
id="stretchSelect"
name="assignment_id"
required>

<option value=""></option>

{% for assignment in assignments %}

<option value="{{ assignment.id }}">
[{{ assignment.section_no }}]
[{{ assignment.survey_day }}]
[{{ assignment.section_length }} KM]
{{ assignment.stretch_code }}
</option>

{% endfor %}

</select>
</div>

            <div class="section-title">
                Survey Day
            </div>

            <select
                name="survey_day"
                class="input-box"
                required>

                <option value="">
                    Select Day
                </option>

                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
                <option>Saturday</option>
                <option>Sunday</option>

            </select>

            <div class="section-title">
                Survey Type
            </div>

            <div class="survey-type-container">

    <label class="survey-card">

        <input
            type="radio"
            name="survey_type"
            value="Day"
            required>

        <span>
            ☀️ Day Survey
        </span>

    </label>

    <label class="survey-card">

        <input
            type="radio"
            name="survey_type"
            value="Night">

        <span>
            🌙 Night Survey
        </span>

    </label>

</div>

            <button
                type="submit"
                class="main-btn">

                CONTINUE

            </button>


            <div id="captainStatusActions"
     style="display:none; margin-top:15px;">

    <button
        type="button"
        id="rescheduleBtn"
        class="main-btn"
        style="background:#f59e0b;">

        🔄 RESCHEDULE

    </button>

    <button
        type="button"
        id="cancelBtn"
        class="main-btn"
        style="background:#dc2626; margin-top:10px;">

        ❌ CANCEL

    </button>

</div>
            
            <div class="action-buttons">

<button
type="button"
class="main-btn secondary-btn"
onclick="window.location.href='/captain-home'">

⬅ BACK TO DASHBOARD

</button>


</div>

        </form>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function() {

    $('#stretchSelect').select2({
        placeholder: "Select Assigned Stretch",
        allowClear: true,
        width: '100%'
    });

    $('#stretchSelect').on('change', function() {

        const assignmentId = $(this).val();

        if (assignmentId) {
            $('#captainStatusActions').show();
        } else {
            $('#captainStatusActions').hide();
        }

    });


    // =========================
    // RESCHEDULE
    // =========================
    $('#rescheduleBtn').on('click', function() {

        const assignmentId = $('#stretchSelect').val();

        if (!assignmentId) {
            alert("Please select a stretch first.");
            return;
        }

        const reason = prompt(
            "Why are you rescheduling this survey?"
        );

        // Cancel button
        if (reason === null) {
            return;
        }

        // Empty / spaces only = NOT ALLOWED
        if (reason.trim() === "") {
            alert("Reason is mandatory. Please enter a reason for rescheduling.");
            return;
        }

        const form = $('<form>', {
            method: 'POST',
            action: '/captain/reschedule/' + assignmentId
        });

        form.append(
            $('<input>', {
                type: 'hidden',
                name: 'reason',
                value: reason.trim()
            })
        );

        $('body').append(form);

        form.submit();

    });


    // =========================
    // CANCEL
    // =========================
    $('#cancelBtn').on('click', function() {

        const assignmentId = $('#stretchSelect').val();

        if (!assignmentId) {
            alert("Please select a stretch first.");
            return;
        }

        const reason = prompt(
            "Why are you cancelling this survey?"
        );

        // Cancel button
        if (reason === null) {
            return;
        }

        // Empty / spaces only = NOT ALLOWED
        if (reason.trim() === "") {
            alert("Reason is mandatory. Please enter a reason for cancellation.");
            return;
        }

        const form = $('<form>', {
            method: 'POST',
            action: '/captain/cancel/' + assignmentId
        });

        form.append(
            $('<input>', {
                type: 'hidden',
                name: 'reason',
                value: reason.trim()
            })
        );

        $('body').append(form);

        form.submit();

    });

});
</script>



</body>

</html>
