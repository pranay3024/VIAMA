<!DOCTYPE html>
<html>

<head>

<title>Extract List</title>

<style>

body{

    font-family:Calibri;
    font-size:18px;
    padding:30px;
    white-space:pre-line;

}

.copy-btn{

    padding:10px 20px;
    background:#ff7a00;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
    margin-bottom:20px;

}

.copy-btn:hover{

    background:#e66d00;

}

</style>

</head>

<body>

<button
id="copyBtn"
onclick="copyList()"
style="
display:inline-flex;
align-items:center;
gap:10px;
padding:12px 24px;
background:linear-gradient(135deg,#ff8a00,#ff6200);
color:#fff;
border:none;
border-radius:12px;
font-size:16px;
font-weight:600;
font-family:Calibri,sans-serif;
cursor:pointer;
box-shadow:0 8px 18px rgba(255,122,0,.30);
transition:all .25s ease;
margin-bottom:25px;
">

📋 Copy List

</button>

<div id="extractList">

{% for survey in surveys -%}
{{ survey.section_no }}_Cycle{{ survey.cycle_no }}<br>
{%- endfor %}

</div>

<script>

function copyList(){

    const text =
    document.getElementById("extractList").innerText;

    navigator.clipboard.writeText(text);

    const btn =
    document.getElementById("copyBtn");

    btn.innerHTML = "✅ Copied!";

    btn.style.background =
    "linear-gradient(135deg,#28a745,#1e8e3e)";

    setTimeout(function(){

        btn.innerHTML = "📋 Copy List";

        btn.style.background =
        "linear-gradient(135deg,#ff8a00,#ff6200)";

    },1500);

}

</script>

</body>

</html>
