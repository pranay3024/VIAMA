<!DOCTYPE html>
<html>

<head>

<title>Change Password</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/admin.css') }}">

<style>

    .pw-container{
        max-width:440px;
        margin:56px auto;
        background:#ffffff;
        padding:34px 38px;
        border-radius:14px;
        box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    .pw-container h2{
        margin:0 0 6px;
        color:#0f172a;
        font-size:20px;
    }

    .pw-container p{
        margin:0 0 20px;
        color:#64748b;
        font-size:13px;
    }

    .pw-container label{
        display:block;
        font-size:13px;
        font-weight:600;
        color:#334155;
        margin:14px 0 6px;
    }

    .pw-container input{
        width:100%;
        padding:12px 14px;
        border:1px solid #cbd5e1;
        border-radius:8px;
        font-size:14px;
        box-sizing:border-box;
        outline:none;
    }

    .pw-container input:focus{
        border-color:#003366;
        box-shadow:0 0 0 3px rgba(0,51,102,.12);
    }

    .pw-container button{
        width:100%;
        margin-top:24px;
        padding:13px;
        border:none;
        border-radius:8px;
        background:#003366;
        color:#ffffff;
        font-size:14px;
        font-weight:700;
        cursor:pointer;
    }

    .pw-container button:hover{
        background:#002349;
    }

</style>

</head>

<body>

<div class="top-navbar">

    <div class="nav-left">

        <img
        src="{{ url_for('static',
        filename='images/viama_logo.png') }}"
        class="logo-img">

        <div class="welcome-text">

            <h2>Change Password</h2>

            <p>
                Survey Form Approver
            </p>

        </div>

    </div>

    <div style="display:flex;gap:15px;align-items:center;">

        <a
        href="/form-approver"
        class="logout-btn">

        ← Back to Dashboard

        </a>

        <a
        href="/logout"
        class="logout-btn">

        Logout

        </a>

    </div>

</div>

<div class="pw-container">

    <h2>Update Password</h2>

    <p>
        Enter your current password and choose a new one.
    </p>

    <form method="POST">

        <label>Current Password</label>

        <input
        type="password"
        name="current_password"
        placeholder="Current Password"
        required>

        <label>New Password</label>

        <input
        type="password"
        name="new_password"
        placeholder="New Password (min 6 characters)"
        required>

        <label>Confirm New Password</label>

        <input
        type="password"
        name="confirm_password"
        placeholder="Confirm New Password"
        required>

        <button type="submit">
            UPDATE PASSWORD
        </button>

    </form>

</div>

</body>

</html>
